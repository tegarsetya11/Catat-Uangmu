name: Deploy Catat Uangmu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir dist
          cp index.html app.js styles.css manifest.webmanifest service-worker.js catat-uangmu-logo.png catat-uangmu-logo-192.png catat-uangmu-logo-512.png developer-photo.jpg search-illustration.png dist/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
