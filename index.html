<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769e0">
  <meta name="description" content="Catat dan pantau keuangan pribadi Anda dengan mudah.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Catat Uangmu</title>
  <link rel="icon" type="image/png" href="catat-uangmu-logo.png">
  <link rel="apple-touch-icon" href="catat-uangmu-logo-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row"><a class="brand" href="#" data-page="home"><img class="brand-logo" src="catat-uangmu-logo.png" alt="Catat Uangmu"></a><button class="sidebar-close" id="sidebar-close" aria-label="Tutup menu"><i data-lucide="x"></i></button></div>
      <div class="side-label">MENU UTAMA</div>
      <nav class="side-nav" aria-label="Navigasi utama">
        <button class="nav-link active" data-page="home"><i data-lucide="layout-dashboard"></i> Lihat Uangmu</button>
        <button class="nav-link" data-page="accounts"><i data-lucide="landmark"></i> Akun</button>
        <button class="nav-link" data-page="transfers"><i data-lucide="arrow-left-right"></i> Transfer</button>
        <button class="nav-link" data-page="all-reports"><i data-lucide="file-chart-column"></i> Laporan semua akun</button>
      </nav>
      <div class="side-label side-label-lower">LAINNYA</div>
      <nav class="side-nav" aria-label="Menu lainnya">
        <button class="nav-link" data-page="categories"><i data-lucide="tags"></i> Nama transaksi</button>
        <button class="nav-link" data-page="notes"><i data-lucide="notebook-pen"></i> Buku catatan</button>
        <button class="nav-link" data-page="calendar"><i data-lucide="calendar-days"></i> Kalender</button>
        <button class="nav-link" data-page="calculator"><i data-lucide="calculator"></i> Kalkulator kas</button>
        <button class="nav-link" data-page="trash"><i data-lucide="trash-2"></i> Transaksi dihapus <span id="trash-count" class="nav-count"></span></button>
        <button class="nav-link" data-page="backup"><i data-lucide="cloud"></i> Cadangkan data</button>
        <button class="nav-link" data-page="settings"><i data-lucide="settings-2"></i> Pengaturan</button>
      </nav>
      <section class="sidebar-download" aria-label="Download laporan">
        <div class="side-label">DOWNLOAD LAPORAN</div>
        <div class="sidebar-download-actions">
          <button class="button button-outline" data-action="export-xlsx"><i data-lucide="sheet"></i> Excel</button>
          <button class="button button-outline" data-action="export-pdf"><i data-lucide="file-text"></i> PDF</button>
        </div>
      </section>
      <div class="sidebar-foot"><span class="status-dot"></span> Data tersimpan di perangkat ini</div>
      <button class="button button-primary install-app-button" id="install-app" type="button" data-action="install-app"><i data-lucide="download"></i> Instal aplikasi Android</button>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Buka menu"><i data-lucide="menu"></i></button>
        <div class="breadcrumb"><span id="page-eyebrow">RUANG KEUANGAN</span><strong id="page-title">Lihat Uangmu</strong></div>
        <div class="topbar-actions">
          <label class="search-box"><img class="search-illustration" src="search-illustration.png" alt=""><input id="search-input" placeholder="Cari transaksi..." aria-label="Cari transaksi"><kbd>⌘ K</kbd></label>
          <button class="icon-button" data-page="all-reports" aria-label="Laporan"><i data-lucide="file-text"></i></button>
          <button class="avatar-button" id="user-avatar" data-page="settings" aria-label="Pengaturan pengguna">T</button>
        </div>
      </header>
      <div class="content" id="page-content"></div>
    </main>
  </div>
  <div class="mobile-dock" aria-label="Navigasi cepat">
    <button class="active" data-page="home"><i data-lucide="house"></i><span>Lihat Uangmu</span></button>
    <button data-page="all-reports"><i data-lucide="file-chart-column"></i><span>Laporan</span></button>
    <button data-page="accounts"><i data-lucide="wallet-cards"></i><span>Akun</span></button>
    <button data-page="notes"><i data-lucide="notebook-pen"></i><span>Catatan</span></button>
    <button data-page="settings"><i data-lucide="menu"></i><span>Lainnya</span></button>
  </div>
  <div class="modal-layer" id="modal-layer" aria-hidden="true"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
</body>
</html>
